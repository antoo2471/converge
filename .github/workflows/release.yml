name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: converge-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Allocate the monthly release number
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        id: version
        run: |
          node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY) throw new Error('Configure TAURI_SIGNING_PRIVATE_KEY before publishing')"
          node scripts/release-version.mjs --write
      - name: Commit and tag the exact version being built
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          if ! git diff --cached --quiet; then git commit -m "release: ${TAG}"; fi
          git tag "$TAG"
          git push origin HEAD:main "$TAG"
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" --draft --title "Converge $VERSION" --generate-notes
          echo "release_id=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/$TAG --jq .id)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      release_id: ${{ needs.prepare.outputs.release_id }}
    secrets: inherit

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish only after all six native builds succeed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
